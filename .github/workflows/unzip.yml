name: Unzip uploaded zip
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip zip and publish files
        run: |
          set -e
          ls -la
          ZIP_FILE=$(ls *.zip | head -n 1)
          echo "Zip file: $ZIP_FILE"
          rm -rf extracted_tmp
          mkdir -p extracted_tmp
          unzip -o "$ZIP_FILE" -d extracted_tmp
          echo "Extracted tree:"
          find extracted_tmp -maxdepth 4 | sort
          CI_FILE=$(find extracted_tmp -path '*/.github/workflows/ci.yml' | head -n 1)
          echo "CI file: $CI_FILE"
          echo "===== BEGIN ci.yml ====="
          cat "$CI_FILE"
          echo "===== END ci.yml ====="
          ROOT_DIR=""
          for d in extracted_tmp extracted_tmp/* extracted_tmp/*/*; do
            if [ -d "$d" ] && [ -f "$d/README.md" ] && [ -d "$d/src" ]; then
              ROOT_DIR="$d"
              break
            fi
          done
          echo "Root folder: $ROOT_DIR"
          if [ -z "$ROOT_DIR" ]; then
            echo "No folder with README.md and src/ found; copying extracted contents"
            cp -a extracted_tmp/. .
          else
            cp -a "$ROOT_DIR"/. .
          fi
          rm -f .github/workflows/ci.yml
          rm -f "$ZIP_FILE"
          rm -rf extracted_tmp
          echo "Files after copy:"
          ls -la
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Add project files from zip" || echo "Nothing to commit"
          git push
